spring.application.name=blockbeard-backend

# Importe les identifiants locaux (fichier ignore par Git)
spring.config.import=optional:classpath:application-local.properties

# Obligatoire : les tables sont gerees directement sur Supabase (Hibernate ne modifie pas le schema)
spring.jpa.hibernate.ddl-auto=none

# Bonne pratique : ferme la session BDD avant la serialisation JSON
spring.jpa.open-in-view=false

# Affiche les requetes SQL en console pendant le developpement
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Permet au front-end de lire les messages d'erreur personnalises (ex. "Ce pseudo est deja utilise.")
server.error.include-message=always

# Port dynamique pour l'hebergement cloud (Render injecte la variable PORT, sinon 8080 en local)
server.port=${PORT:8080}

# Sert aussi les pages HTML / CSS / JS / assets de la racine du projet directement sur le meme serveur
spring.web.resources.static-locations=classpath:/static/,file:./,file:../
